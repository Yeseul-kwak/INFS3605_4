<title>Brewroster</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy sidebar + white workspace. One look: navy and white, semantic colour only for status. */
:root {
  --navy-950: #071427; --navy-900: #0B1F3A; --navy-800: #112B50; --navy-700: #183763; --navy-600: #244680;
  --navy-400: #5C7DAE; --navy-300: #9DB0CC; --navy-200: #C9D4E5; --navy-100: #E4EAF3; --navy-50: #F4F7FB;
  --white: #FFFFFF; --ink: #0B1F3A; --ink-2: #46597A; --ink-3: #6B7D99; --line: #DCE3EE;
  --ok: #1D7A4B; --ok-bg: #E3F3EA; --warn: #9A5B00; --warn-bg: #FCEFD6; --bad: #B3261E; --bad-bg: #FBE7E5;
  --amber: #C9820A;
  --font: 'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { background: var(--white); }
body { color: var(--ink); font: 14px/1.45 var(--font); margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--navy-600); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.side {
  background: var(--navy-900); color: #fff; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
  padding: 22px 14px 18px max(14px, env(safe-area-inset-left, 0px));
}
.brand { display: flex; align-items: center; gap: 11px; padding: 2px 8px 22px; }
.logo { width: 34px; height: 34px; border-radius: 9px; background: #fff; color: var(--navy-900); display: grid; place-items: center; font-weight: 700; font-size: 17px; flex: none; }
.brand b { display: block; font-size: 15px; letter-spacing: .01em; }
.brand small { display: block; color: var(--navy-300); font-size: 12px; margin-top: 1px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button {
  display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; background: none; border: 0; color: var(--navy-200);
  padding: 10px 10px; border-radius: 8px; font-weight: 500;
}
.nav button:hover { background: var(--navy-800); color: #fff; }
.nav button[aria-current="page"] { background: #fff; color: var(--navy-900); }
.nav .badge { margin-left: auto; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; background: #fff; color: var(--navy-900); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.nav button[aria-current="page"] .badge { background: var(--navy-900); color: #fff; }
.nav .badge.alert { background: #F2B8B3; color: #5C1410; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 14px; }
.pos { border: 1px solid var(--navy-700); border-radius: 10px; padding: 11px 12px; font-size: 12px; color: var(--navy-200); line-height: 1.4; }
.pos b { color: #fff; font-weight: 600; display: flex; align-items: center; gap: 7px; font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #5FD39A; flex: none; }
.owner { display: flex; align-items: center; gap: 10px; padding: 0 6px; font-size: 13px; }
.owner .avatar { background: var(--navy-700); color: #fff; }
.owner small { display: block; color: var(--navy-300); font-size: 12px; }

.main { min-width: 0; padding-block: 30px 56px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.head h1 { font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
.head p { color: var(--ink-2); margin-top: 4px; max-width: 62ch; }
.head-r { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.panel { border: 1px solid var(--line); border-radius: 12px; background: #fff; padding: 20px; min-width: 0; }
.panel h2 { font-size: 16px; font-weight: 650; }
.panel h3 { font-size: 14px; font-weight: 650; }
.panel-h { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 16px; }
.panel-h p { color: var(--ink-2); font-size: 13px; margin-top: 3px; max-width: 64ch; }
.cols { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
.muted { color: var(--ink-2); }
.small { font-size: 12px; color: var(--ink-3); }

.btn { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 8px; padding: 9px 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn:hover { background: var(--navy-50); border-color: var(--navy-300); }
.btn.primary { background: var(--navy-900); border-color: var(--navy-900); color: #fff; }
.btn.primary:hover { background: var(--navy-700); }
.btn.danger { color: var(--bad); }
.btn.danger:hover { background: var(--bad-bg); border-color: #E7B1AC; }
.btn[disabled] { opacity: .5; cursor: default; pointer-events: none; }
.btn.sm { padding: 6px 11px; font-size: 13px; }
.icon-btn { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: #fff; display: grid; place-items: center; font-size: 18px; line-height: 1; }
.icon-btn:hover { background: var(--navy-50); }
.icon-btn[disabled] { opacity: .35; pointer-events: none; }
.wk { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.wk span { min-width: 168px; text-align: center; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--navy-100); color: var(--navy-700); white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.solid { background: var(--navy-900); color: #fff; }
.chip.line { background: #fff; border: 1px solid var(--line); color: var(--ink-2); font-weight: 500; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--navy-100); color: var(--navy-700); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
.kpi { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; background: #fff; }
.kpi .l { font-size: 12px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
.kpi .v { font-size: 28px; font-weight: 700; letter-spacing: -.01em; margin-top: 6px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.kpi .s.good { color: var(--ok); font-weight: 600; }
.kpi .s.bad { color: var(--bad); font-weight: 600; }
.kpi.alert .v { color: var(--bad); }

.banner { display: flex; align-items: center; gap: 14px; padding: 13px 16px; border-radius: 10px; border: 1px solid; flex-wrap: wrap; }
.banner > div { flex: 1; min-width: 220px; }
.banner.bad { background: var(--bad-bg); border-color: #EDBDB8; color: #6B1610; }
.banner.warn { background: var(--warn-bg); border-color: #EACB91; color: #5E3800; }
.banner.info { background: var(--navy-50); border-color: var(--navy-200); color: var(--navy-800); }

/* steps */
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.step { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; }
.step .n { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--navy-300); display: grid; place-items: center; font-weight: 700; font-size: 12px; color: var(--navy-600); flex: none; }
.step.done .n { background: var(--navy-900); border-color: var(--navy-900); color: #fff; }
.step b { display: block; }
.step p { color: var(--ink-2); font-size: 13px; margin: 2px 0 10px; }

/* day cards */
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
.day { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.day:hover { border-color: var(--navy-400); background: var(--navy-50); }
.day-top { display: flex; align-items: baseline; gap: 6px; }
.day-top b { font-size: 15px; }
.day-top span { color: var(--ink-3); font-size: 12px; }
.day-w { font-size: 12px; color: var(--ink-2); }
.day-peak { font-size: 12px; color: var(--ink-2); }
.day-peak b { color: var(--ink); }

/* peaks */
.peaks { display: flex; flex-direction: column; gap: 10px; }
.peak { display: grid; grid-template-columns: 110px minmax(0, 1fr) 270px; gap: 12px; align-items: center; font-size: 13px; }
.peak .bar { height: 10px; border-radius: 5px; background: var(--navy-100); overflow: hidden; }
.peak .bar i { display: block; height: 100%; background: var(--navy-700); border-radius: 5px; }
.peak .r { color: var(--ink-2); text-align: right; }

/* heatmap */
.hs { overflow-x: auto; }
.heat { display: grid; grid-template-columns: 56px repeat(7, minmax(54px, 1fr)); gap: 4px; min-width: 460px; }
.heat .hh { font-size: 12px; font-weight: 600; color: var(--ink-3); text-align: center; padding: 2px 0 6px; }
.heat .hl { font-size: 12px; color: var(--ink-3); display: flex; align-items: center; }
.heat button { border: 0; border-radius: 6px; height: 40px; font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
.heat button.sel { outline: 2.5px solid var(--navy-900); outline-offset: 1px; }
.heat .closed { background: transparent; border: 1px dashed var(--line); border-radius: 6px; height: 40px; display: grid; place-items: center; color: var(--ink-3); font-size: 11px; }
.legend { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ink-3); margin-top: 14px; flex-wrap: wrap; }
.legend .ramp { width: 120px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #F4F7FB, #183763); }
.sw-row { display: flex; gap: 8px; align-items: center; }
.sw-i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

.stat-list { display: grid; grid-template-columns: 1fr auto; gap: 9px 12px; margin: 14px 0; font-size: 13px; }
.stat-list dt { color: var(--ink-2); }
.stat-list dd { margin: 0; font-weight: 650; text-align: right; font-variant-numeric: tabular-nums; }
.mini { display: flex; align-items: flex-end; gap: 4px; height: 44px; margin-top: 8px; }
.mini i { flex: 1; background: var(--navy-300); border-radius: 3px 3px 0 0; min-height: 3px; }
.mini i.hi { background: var(--navy-700); }

/* chart */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: 13px; display: inline-flex; gap: 7px; align-items: center; }
.tab:hover { background: var(--navy-50); }
.tab[aria-selected="true"] { background: var(--navy-900); border-color: var(--navy-900); color: #fff; }
.tab .d { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.tab .d.bad { background: #E8685F; }
.tab .d.warn { background: #E0A12E; }
.chart { width: 100%; height: auto; display: block; margin-top: 14px; }
.chart text { font-family: var(--font); font-size: 11px; fill: var(--ink-2); font-variant-numeric: tabular-nums; }
.chart .ax { fill: var(--ink-3); }
.chart .tt { font-size: 12px; font-weight: 600; fill: var(--ink); }
.switches { display: flex; gap: 22px; flex-wrap: wrap; align-items: center; }
.switch { display: inline-flex; align-items: center; gap: 9px; background: none; border: 0; padding: 0; font-weight: 600; font-size: 13px; }
.switch .tr { width: 36px; height: 20px; border-radius: 10px; background: var(--navy-200); position: relative; transition: background .15s; flex: none; }
.switch .tr::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch[aria-checked="true"] .tr { background: var(--navy-900); }
.switch[aria-checked="true"] .tr::after { transform: translateX(16px); }
.stepper { display: inline-flex; align-items: center; gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stepper button { width: 30px; height: 32px; border: 0; background: #fff; font-size: 16px; }
.stepper button:hover { background: var(--navy-50); }
.stepper b { min-width: 38px; text-align: center; font-variant-numeric: tabular-nums; }
.rules { display: flex; gap: 26px; flex-wrap: wrap; align-items: center; padding-top: 16px; margin-top: 16px; border-top: 1px solid var(--line); }
.rules label { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); }
.note { font-size: 13px; color: var(--ink-2); margin-top: 12px; }
.note b { color: var(--ink); }

/* leave */
.away { display: grid; grid-template-columns: 90px repeat(21, minmax(26px, 1fr)); gap: 3px; min-width: 720px; font-size: 12px; }
.away .h { text-align: center; color: var(--ink-3); font-weight: 600; padding-bottom: 4px; line-height: 1.2; }
.away .h small { display: block; font-weight: 400; }
.away .h.we { color: var(--navy-400); }
.away .nm { display: flex; align-items: center; font-size: 13px; font-weight: 500; }
.away .c { height: 24px; border-radius: 5px; background: var(--navy-50); }
.away .c.we { background: var(--navy-100); }
.away .c.approved { background: var(--navy-900); }
.away .c.pending { background: repeating-linear-gradient(135deg, var(--navy-300) 0 4px, #fff 4px 8px); border: 1px solid var(--navy-300); }
.away .c.wkstart { margin-left: 4px; }
.keyrow { display: flex; gap: 16px; font-size: 12px; color: var(--ink-3); margin-top: 12px; flex-wrap: wrap; }
.keyrow span { display: inline-flex; align-items: center; gap: 7px; }
.req { display: flex; flex-direction: column; gap: 14px; }
.req-top { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.req-top .who { flex: 1; min-width: 200px; }
.req-top .who b { font-size: 15px; display: block; }
.req-top .who span { color: var(--ink-2); font-size: 13px; }
.req-when { font-weight: 650; font-size: 15px; }
.msg { background: var(--navy-50); border: 1px solid var(--navy-100); border-radius: 10px 10px 10px 2px; padding: 11px 14px; font-size: 13.5px; color: var(--navy-800); max-width: 70ch; }
.read { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); }
.impact { border-left: 3px solid var(--navy-300); padding: 2px 0 2px 14px; font-size: 13.5px; max-width: 74ch; }
.impact.safe { border-color: var(--ok); }
.impact.watch { border-color: var(--amber); }
.impact.risk { border-color: var(--bad); }
.impact b { display: block; margin-bottom: 2px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.list { display: flex; flex-direction: column; gap: 14px; }
.empty-state { border: 1px dashed var(--navy-300); border-radius: 12px; padding: 36px 20px; text-align: center; color: var(--ink-2); }
.empty-state b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }

/* roster */
.bot { background: var(--navy-50); border-color: var(--navy-100); }
.bot-h { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 10px; }
.bot-ic { width: 32px; height: 32px; border-radius: 9px; background: var(--navy-900); color: #fff; display: grid; place-items: center; flex: none; }
.bot-h p { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.ex { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.ex li { display: flex; gap: 10px; font-size: 13.5px; }
.ex .mk { width: 18px; height: 18px; border-radius: 50%; background: var(--ok); flex: none; margin-top: 1px; position: relative; }
.ex .mk::after { content: ''; position: absolute; left: 6px; top: 3px; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.ex li.warn .mk { background: var(--amber); }
.ex li.warn .mk::after { left: 7.5px; top: 4px; width: 2px; height: 6px; border-width: 0 2px 0 0; transform: none; }
.rg { display: grid; grid-template-columns: 154px repeat(7, minmax(100px, 1fr)) 84px; gap: 6px; min-width: 990px; align-items: stretch; }
.rg .h { padding: 2px 4px 8px; font-size: 12px; color: var(--ink-3); }
.rg .h b { display: block; color: var(--ink); font-size: 14px; }
.rg .h b span { font-weight: 400; color: var(--ink-3); font-size: 13px; margin-left: 4px; }
.rg .h .chip { margin-top: 5px; font-size: 11px; padding: 2px 8px; }
.rg .n { display: flex; gap: 10px; align-items: center; position: sticky; left: 0; background: #fff; z-index: 1; padding: 2px 8px 2px 0; }
.rg .n .avatar { width: 32px; height: 32px; font-size: 12px; }
.rg .n b { display: block; font-size: 13px; line-height: 1.2; }
.rg .n small { color: var(--ink-3); font-size: 12px; }
.rg .tot { display: flex; flex-direction: column; justify-content: center; font-size: 13px; padding-left: 4px; }
.rg .tot .bar { height: 5px; border-radius: 3px; background: var(--navy-100); margin-top: 5px; overflow: hidden; }
.rg .tot .bar i { display: block; height: 100%; background: var(--navy-700); }
.rg .tot .bar i.full { background: var(--amber); }
.cell { min-height: 48px; border-radius: 8px; border: 1px solid transparent; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; font-size: 13px; font-weight: 600; line-height: 1.25; padding: 4px 6px; background: none; }
.cell small { font-weight: 400; font-size: 11px; opacity: .8; }
.cell.shift { background: var(--navy-900); color: #fff; }
.cell.shift:hover { background: var(--navy-700); }
.cell.clash { background: var(--bad-bg); border-color: #E7B1AC; color: var(--bad); }
.cell.clash b { text-decoration: line-through; font-weight: 600; }
.cell.leave { background: var(--navy-100); color: var(--navy-700); font-weight: 500; font-size: 12px; }
.cell.leave.pending { background: repeating-linear-gradient(135deg, var(--navy-100) 0 5px, #fff 5px 10px); border: 1px dashed var(--navy-300); }
.cell.na { color: var(--ink-3); font-weight: 400; font-size: 12px; opacity: .55; }
.cell.empty { border: 1px dashed var(--navy-200); color: var(--navy-300); font-size: 18px; font-weight: 400; }
.cell.empty:hover, .cell.na:hover { background: var(--navy-50); border-color: var(--navy-400); opacity: 1; }
.cv { min-height: 40px; border-radius: 7px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; background: var(--navy-50); color: var(--navy-800); font-variant-numeric: tabular-nums; line-height: 1.2; }
.cv small { font-weight: 400; font-size: 11px; color: var(--ink-3); }
.cv.short { background: var(--bad-bg); color: var(--bad); }
.cv.short small { color: var(--bad); }
.cv.nob { background: #fff; border: 1.5px solid var(--bad); color: var(--bad); }
.cv.over { background: var(--warn-bg); color: var(--warn); }
.cv.closed { background: transparent; border: 1px dashed var(--line); color: var(--ink-3); font-weight: 400; font-size: 11px; }
.cv-l { font-size: 12px; color: var(--ink-3); display: flex; align-items: center; position: sticky; left: 0; background: #fff; z-index: 1; }

/* standby */
.gap { display: flex; flex-direction: column; gap: 14px; }
.cand { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.cand b { display: block; }
.cand .meta { color: var(--ink-2); font-size: 13px; }
.cand .cost { text-align: right; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cand .cost b { color: var(--ink); }
.log { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 9px; font-size: 13.5px; }
.log li { display: flex; gap: 10px; align-items: center; }

/* team */
.team { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.person { display: flex; flex-direction: column; gap: 14px; }
.person-top { display: flex; gap: 12px; align-items: center; }
.person-top .avatar { width: 42px; height: 42px; font-size: 14px; }
.person-top b { display: block; font-size: 15px; }
.person-top span { color: var(--ink-2); font-size: 13px; }
.avail { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.avail div { text-align: center; font-size: 11px; line-height: 1.25; padding: 5px 0; border-radius: 6px; background: var(--navy-100); color: var(--navy-700); }
.avail div b { display: block; font-size: 11px; color: var(--ink-3); font-weight: 600; }
.avail div.off { background: var(--navy-50); color: var(--ink-3); opacity: .7; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kv div { font-size: 12px; color: var(--ink-3); }

function pd(s) { const p = s.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); }

function addDays(s, n) { const d = pd(s); d.setUTCDate(d.getUTCDate() + n); return fd(d); }

function dayNum(s) { return pd(s).getUTCDate(); }
function monOf(s) { return MON[pd(s).getUTCMonth()]; }
function dLabel(s) { return DOW[dowOf(s)] + ' ' + dayNum(s) + ' ' + monOf(s); }
function dShort(s) { return dayNum(s) + ' ' + monOf(s); }
function weekDays(ws) { return [0, 1, 2, 3, 4, 5, 6].map(function (i) { return addDays(ws, i); }); }

function ampm(h) { return h >= 12 ? 'pm' : 'am'; }
function h12(h) { return h > 12 ? h - 12 : h; }
function hFmt(h) { return h12(h) + ampm(h); }
function hRange(a, b) { return ampm(a) === ampm(b) ? h12(a) + '–' + h12(b) + ampm(b) : hFmt(a) + '–' + hFmt(b); }
function hColon(h) { return h12(h) + ':00' + ampm(h); }

/* ---------- seeded random ---------- */
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

  const k = dow < 4 ? 'wk' : dow === 4 ? 'fri' : dow === 5 ? 'sat' : 'sun';
  return BASE_TX[k][h - OPEN_H];
}
function genHistory() {
  const r = rng(20261015); const rows = []; let d = HISTORY_FROM;
  while (d <= HISTORY_TO) {
    const dow = dowOf(d); const dayF = 0.9 + 0.16 * r();
    openHours(dow).forEach(function (h) {
      const tx = Math.max(4, Math.round(baseFor(dow, h) * dayF * (0.9 + 0.2 * r())));

function chartSVG(date, show) {

  const maxV = Math.max.apply(null, cov.map(function (x) { return Math.max(x.tx, show ? x.have * c.cap : 0); }).concat([40]));
  const step = maxV > 120 ? 40 : 20, top = Math.ceil(maxV / step) * step;
  const y = function (v) { return mt + ih - (v / top) * ih; };
  const n = cov.length, bw = iw / n, barW = bw * 0.56;
  let s = '<svg class="chart" viewBox="0 0 ' + Wd + ' ' + Ht + '" role="img" aria-label="Forecast transactions per hour against rostered capacity">';
  for (let v = 0; v <= top; v += step) {
    s += '<line x1="' + ml + '" x2="' + (Wd - mr) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#DCE3EE" stroke-width="1"/><text class="ax" x="' + (ml - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>';

    s += '<rect x="' + (cx - barW / 2) + '" y="' + y(served) + '" width="' + barW + '" height="' + Math.max(0, y(0) - y(served)) + '" fill="#244680" rx="2"/>';

/* ---------- LEAVE ---------- */

/* ---------- SHIFT COVER (team chat + standby) ---------- */

    let act;
    if (!al) act = '<button class="btn sm" data-act="alert" data-key="' + key + '">Send alert</button>';
    else if (al.status === 'sent') act = '<span class="chip warn"><span class="spin"></span> Waiting</span>';
    else if (al.status === 'declined') act = '<span class="chip bad">Cannot make it</span>';
    else act = '<span class="chip">Alert sent</span>';
    return '<div class="cand"><span class="avatar">' + x.s.initials + '</span><div><b>' + x.s.name + '</b><div class="meta">' + x.s.role + ' · ' + x.wk + 'h of ' + x.s.max + 'h this week</div></div><div class="cost"><b>' + hRange(x.from, x.to) + '</b><br>' + money(x.cost) + '</div><div class="act">' + act + '</div></div>';
  }).join('');
  const offHtml = off.length ? '<details class="more"><summary>' + off.length + ' happy to work but not free</summary>' + off.map(function (x) { return '<div class="rowline"><b>' + x.s.first + '</b><span>' + esc(x.why) + '</span></div>'; }).join('') + '</details>' : '';
  return rows + offHtml;
}
function gapSection(gap, ws, r, c, title, chips) {
  const cands = standbyFor(gap, ws, r, c), free = cands.filter(function (x) { return x.free; }), dow = dowOf(gap.date);
  const canAll = free.some(function (x) { return !state.alerts[gapKey(gap) + '|' + x.s.id]; });
  return '<section class="panel gap"><div class="panel-h" style="margin-bottom:0"><div><h2>' + title + '</h2><div class="chips" style="margin-top:8px">' + chips + '</div>' +
    '<p style="margin-top:10px">' + (cands.length ? '<b>' + free.length + ' of ' + cands.length + '</b> ' + plural(cands.length, 'person who is', 'people who are') + ' happy to work ' + DOW_LONG[dow] + 's ' + plural(free.length, 'is', 'are') + ' free.' : 'Nobody has said they are happy to work ' + DOW_LONG[dow] + 's.') + '</p></div>' +
    (canAll ? '<button class="btn sm primary" data-act="alertAll" data-gap="' + gapKey(gap) + '">Alert everyone who is free</button>' : '') + '</div>' +
    (cands.length ? candRows(gap, ws, r, c) : '<div class="empty-state" style="margin-top:14px"><b>Nobody is on the standby list for ' + DOW_LONG[dow] + 's</b>Ask staff to turn on ' + DOW[dow] + ' under Team.<div style="margin-top:12px"><button class="btn sm" data-act="go" data-v="team">Open team</button></div></div>') + '</section>';
}
function standbyTab() {
  const c = ctx(), opens = openLate(), gaps = standbyGaps();
  const lateCards = opens.map(function (l) {
    const lws = weekStartOf(l.date), lr = state.rosters[lws], imp = lateImpact(l, lws, lr, c), gap = gapFromLate(l, imp), s = staffById(l.staffId);
    const chips = '<span class="chip ' + (l.kind === 'optout' ? 'warn' : 'bad') + '">' + s.first + (l.kind === 'optout' ? ' opted out, nobody registered' : ' cancelled') + ' · ' + esc(l.reason) + '</span>' + (imp.needs ? '<span class="chip line">' + money(imp.lost) + ' sales at risk</span>' : '<span class="chip ok">Still covered</span>') + (imp.bshortHours ? '<span class="chip line">Needs a barista</span>' : '');
    return gapSection(gap, lws, lr, c, dLabel(l.date) + ', ' + hRange(l.shift[0], l.shift[1]), chips);
  }).join('');
  const gapCards = gaps.map(function (g) {
    const chips = (g.short ? '<span class="chip bad">' + g.short + ' ' + plural(g.short, 'person') + ' short</span>' : '') + (g.bshort ? '<span class="chip line">Needs a barista</span>' : '') + '<span class="chip line">' + money(g.lost) + ' sales at risk</span>';
    const gws = weekStartOf(g.date);
    return gapSection(g, gws, state.rosters[gws], c, dLabel(g.date) + ', ' + hRange(g.from, g.to), chips);
  }).join('');
  const log = state.log.length ? '<section class="panel"><h2 style="margin-bottom:10px">Recent replies</h2><ul class="log">' + state.log.slice(0, 4).map(function (l) { return '<li><span class="chip ' + (l.ok === null ? 'line' : l.ok ? 'ok' : 'bad') + '">' + (l.ok === null ? 'Not needed' : l.ok ? 'Accepted' : 'Declined') + '</span><span>' + esc(l.text) + '</span></li>'; }).join('') + '</ul></section>' : '';
  const n = opens.length + gaps.length;
  return '<p class="note" style="margin-top:0">Standby is for day shifts starting within 48 hours (before ' + dLabel(addDays(TODAY, 2)) + ', ' + clockText() + '). You see everyone who is happy to work that day and who is free.</p>' +
    (n ? '<div class="list">' + lateCards + gapCards + '</div>' : '<div class="empty-state"><b>Nothing needs standby cover</b>If someone cancels a shift within 48 hours, it appears here with the people you can call.</div>') + doneRows('standby') + log;
}
function vCover() {
  const chatN = openChat().length + chatGaps().length, sbN = openLate().length + standbyGaps().length, tab = state.coverTab;
  const tabs = '<button class="tab" role="tab" aria-selected="' + (tab === 'chat') + '" data-act="covertab" data-t="chat">Team chat (' + chatN + ')</button><button class="tab" role="tab" aria-selected="' + (tab === 'standby') + '" data-act="covertab" data-t="standby">Standby (' + sbN + ')</button>';
  const simO = validOptPool().length, simL = validLatePool().length;
  const right = tab === 'chat' ? '<button class="btn demo" data-act="simulateOpt"' + (simO ? '' : ' disabled') + '>Demo: a worker opts out' + (simO ? ' (' + simO + ')' : '') + '</button>' :
    '<button class="btn demo" data-act="simulateLate"' + (simL ? '' : ' disabled') + '>Demo: a late cancellation' + (simL ? ' (' + simL + ')' : '') + '</button>';
  return pageHead('Shift cover', 'When someone cannot work a shift on the uploaded roster. The earlier they tell you, the less it costs.', right) +
    rulesBar(tab) + '<div class="tabs" role="tablist">' + tabs + '</div>' + (tab === 'chat' ? chatTab() : standbyTab());
}

/* ---------- TEAM ---------- */
function vTeam() {
  const cards = STAFF.map(function (s) {
    const av = s.avail.map(function (a, i) { return '<div class="' + (a ? '' : 'off') + '"><b>' + DOW[i] + '</b>' + (a ? hFmt(a[0]).replace('am', '').replace('pm', '') + '–' + hFmt(a[1]).replace('am', '').replace('pm', '') : '–') + '</div>'; }).join('');
    const sbd = s.standbyDays.map(function (on, i) { return '<button class="dchip" aria-pressed="' + on + '" data-act="standbyDay" data-id="' + s.id + '" data-d="' + i + '" aria-label="Happy to be called in on ' + DOW_LONG[i] + 's">' + DOW[i] + '</button>'; }).join('');
    return '<article class="panel person"><div class="person-top"><span class="avatar">' + s.initials + '</span><div><b>' + s.name + '</b><span>' + s.role + ' · $' + s.rate + '/h · up to ' + s.max + 'h a week</span></div></div>' +
      '<div><div class="small" style="margin-bottom:6px">Usual availability</div><div class="avail">' + av + '</div></div>' +
      '<div><div class="small" style="margin-bottom:6px">Happy to be called in on (Standby)</div><div class="dchips">' + sbd + '</div></div></article>';
  }).join('');
  return pageHead('Team', STAFF.length + ' people. Their usual availability and the days they are happy to be called in at short notice.', '') + '<div class="team">' + cards + '</div>';
}

/* ---------- shell ---------- */
const VIEWS = { home: vHome, roster: vRoster, leave: vLeave, cover: vCover, demand: vDemand, team: vTeam };
const NAV = [['home', 'Home'], ['roster', 'Roster'], ['leave', 'Leave requests'], ['cover', 'Shift cover'], ['demand', 'Demand'], ['team', 'Team']];
function renderNav() {
  const pend = state.leaves.filter(function (l) { return l.status === 'pending'; }).length;
  const chatN = openChat().length + chatGaps().length, sbN = openLate().length + standbyGaps().length, cov = chatN + sbN;
  document.getElementById('nav').innerHTML = NAV.map(function (n) {
    const b = n[0] === 'leave' && pend ? '<span class="badge">' + pend + '</span>' : n[0] === 'cover' && cov ? '<span class="badge' + (sbN ? ' alert' : '') + '">' + cov + '</span>' : '';
    return '<button data-act="nav" data-v="' + n[0] + '"' + (state.view === n[0] ? ' aria-current="page"' : '') + '>' + ic(n[0]) + n[1] + b + '</button>';
  }).join('');
}
function render() {
  const sc = Array.prototype.map.call(document.querySelectorAll('.hs'), function (e) { return e.scrollLeft; });
  const open = Array.prototype.map.call(document.querySelectorAll('details'), function (e) { return e.open; });
  document.getElementById('view').innerHTML = VIEWS[state.view]();
  Array.prototype.forEach.call(document.querySelectorAll('.hs'), function (e, i) { if (sc[i]) e.scrollLeft = sc[i]; });
  const ds = document.querySelectorAll('details'); if (ds.length === open.length) Array.prototype.forEach.call(ds, function (e, i) { e.open = open[i]; });
  renderNav();
}

/* ---------- actions ---------- */
function runOptimise(ws) {
  const c = ctx(), after = optimiseWeek(ws, c);
  const ex = { before: evalWeek(ws, habitRoster(ws), c), after: evalWeek(ws, after, c) };
  state.rosters[ws] = after; state.explain[ws] = ex;
  return ex;
}
function setLeave(id, status) {
  const l = state.leaves.find(function (x) { return x.id === id; });
  if (leaveLocked(l)) { toast('That roster is already uploaded, so this decision is locked.', 'bad'); return; }
  l.status = status;
  const s = staffById(l.staffId), rebuilt = [], ready = [];
  WEEKS.forEach(function (ws) {
    if (!overlaps(l, ws)) return;
    const r = state.rosters[ws];
    if (isBuilt(ws) && r.status === 'draft') { runOptimise(ws); rebuilt.push(dShort(ws)); }
    else if (!isBuilt(ws) && pendingFor(ws) === 0) ready.push(dShort(ws));
  });
  let msg = (status === 'approved' ? 'Approved ' : 'Declined ') + s.first + '\'s leave.';
  if (rebuilt.length) msg += ' Rosterbot rebuilt the roster for the week of ' + rebuilt.join(' and ') + '.';
  else if (ready.length) msg += ' The roster for the week of ' + ready.join(' and ') + ' can now be built.';
  toast(msg);
}
function doOptimise() {
  if (state.busy) return;
  state.busy = true; render();
  setTimeout(function () {
    const ws = state.week; runOptimise(ws);
    state.busy = false; render();
    toast('Roster built for ' + weekLabel(ws) + '.');
  }, 900);
}
function openModal(date, id) {
  const c = ctx(), r = R(), s = c.byId[id], dow = dowOf(date), sh = r.shifts[date] && r.shifts[date][id], av = s.avail[dow], lv = leaveOn(c, id, date);
  const close = closeH(dow);
  const def = sh || (av ? [av[0], Math.min(av[0] + 6, av[1], close)] : [OPEN_H, Math.min(OPEN_H + 6, close)]);
  state.modal = { date: date, id: id };
  const startOpts = openHours(dow).map(function (h) { return '<option value="' + h + '"' + (h === def[0] ? ' selected' : '') + '>' + hColon(h) + '</option>'; }).join('');
  const endOpts = []; for (let h = OPEN_H + 1; h <= close; h++) endOpts.push('<option value="' + h + '"' + (h === def[1] ? ' selected' : '') + '>' + hColon(h) + '</option>');
  const warns = [];
  if (lv === 'approved') warns.push(s.first + ' is on approved leave this day.');
  else if (!av) warns.push(s.first + ' is not usually available on ' + DOW_LONG[dow] + 's.');
  else warns.push('Usually available ' + hRange(av[0], av[1]) + '.');
  const isWarn = lv || !av;
  document.getElementById('modal').innerHTML = '<div class="scrim" data-act="closeModal" id="scrim"><div class="modal" role="dialog" aria-modal="true" aria-label="Edit shift"><div><h2>' + s.name + '</h2><p class="muted">' + dLabel(date) + '</p></div>' +
    '<div class="' + (isWarn ? 'warnline' : 'small') + '">' + warns.join(' ') + '</div>' +
    '<div class="row"><label for="m-start">Start<select id="m-start">' + startOpts + '</select></label><label for="m-end">Finish<select id="m-end">' + endOpts.join('') + '</select></label></div>' +
    '<div class="acts"><div>' + (sh ? '<button class="btn danger" data-act="removeShift">Remove shift</button>' : '') + '</div><div class="head-r"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="saveShift">Save shift</button></div></div></div></div>';
  const first = document.getElementById('m-start'); if (first) first.focus();
}
function closeModal() { state.modal = null; document.getElementById('modal').innerHTML = ''; }
function touchRoster(ws) { const r = state.rosters[ws]; r.source = 'manual'; state.explain[ws] = null; r.stale = false; }
function sendAlert(key) {
  if (state.alerts[key]) return;
  state.alerts[key] = { status: 'sent' };
  const id = key.slice(key.lastIndexOf('|') + 1);
  setTimeout(function () { resolveAlert(key); }, 1100 + id.length * 130);
}
function postGap(gk) {
  const found = findGapByKey(gk); if (!found || state.posted[gk]) return;
  const g = found.gap;
  state.posted[gk] = { at: clockText() };
  postChat('open', 'Open shift: ' + dLabel(g.date) + ', ' + hRange(g.from, g.to) + '. The roster needs one more person. Normal pay. Tap to register.');
  toast('Posted to the team chat. ' + STAFF.length + ' people were notified.');
}
function registerOpen(gk) {
  const found = findGapByKey(gk); if (!found) return;
  const c = ctx(), cands = standbyFor(found.gap, found.ws, found.r, c, 'chat').filter(function (x) { return x.free; });
  if (!cands.length) { toast('Nobody on the team is free for this shift.', 'bad'); return; }
  const x = cands.find(function (q) { return q.inWin; }) || cands[0], date = found.gap.date, r = found.r;
  r.shifts[date] = r.shifts[date] || {}; r.shifts[date][x.s.id] = [x.from, x.to]; r.sb = r.sb || {}; r.sb[date + '|' + x.s.id] = 'chat';
  if (found.late) { found.late.status = 'covered'; found.late.coveredBy = x.s.id; found.late.via = 'chat'; }
  postChat('reg', x.s.name + ' registered for ' + dLabel(date) + ', ' + hRange(x.from, x.to) + '.');
  postChat('note', dLabel(date) + ' is filled.');
  toast(x.s.first + ' registered for ' + dLabel(date) + ', ' + hRange(x.from, x.to) + '. The roster is updated.');
}
function escalate(id) {
  const l = state.late.find(function (x) { return x.id === id; }); if (!l || l.status !== 'open' || l.phase !== 'chat') return;
  l.phase = 'standby';
  postChat('note', 'Nobody registered for ' + dLabel(l.date) + ', ' + hRange(l.shift[0], l.shift[1]) + '. It is now within 48 hours and has moved to Standby.');
  toast('Skipped ahead to 48 hours before the shift. It has moved to Standby.');
}
function resolveAlert(key) {
  const idx = key.lastIndexOf('|'), gk = key.slice(0, idx), id = key.slice(idx + 1), c = ctx(), s = c.byId[id];
  const found = findGapByKey(gk);
  const cand = found && standbyFor(found.gap, found.ws, found.r, c).find(function (x) { return x.s.id === id && x.free; });
  if (!found || !cand) {
    delete state.alerts[key];
    state.log.unshift({ ok: null, text: s.first + ' replied after the shift was already covered. No change needed.' });
  } else {
    const date = found.gap.date;
    if (standbyOutcome(date, id) === 'accepted') {
      const r = found.r; r.shifts[date] = r.shifts[date] || {}; r.shifts[date][id] = [cand.from, cand.to]; r.sb = r.sb || {}; r.sb[date + '|' + id] = true;
      if (found.late) { found.late.status = 'covered'; found.late.coveredBy = id; found.late.via = 'standby'; if (found.late.kind === 'optout') postChat('note', dLabel(date) + ' was filled through Standby.'); }
      state.alerts[key] = { status: 'accepted' };
      const t = s.first + ' accepted ' + dLabel(date) + ', ' + hRange(cand.from, cand.to) + '. Added to the roster.';
      state.log.unshift({ ok: true, text: t }); toast(t);
    } else {
      state.alerts[key] = { status: 'declined' };
      const t = s.first + ' cannot make ' + dLabel(date) + ', ' + hRange(cand.from, cand.to) + '.';
      state.log.unshift({ ok: false, text: t }); toast(t);
    }
  }
  render();
}
function toTop() { window.scrollTo(0, 0); }

const ACT = {
  nav: function (t) { state.view = t.dataset.v; render(); toTop(); },
  go: function (t) {
    state.view = t.dataset.v;
    if (t.dataset.tab) state.coverTab = t.dataset.tab;
    if (t.dataset.week) state.week = t.dataset.week;
    render(); toTop();
  },
  goCover: function (t) { state.view = 'cover'; state.coverTab = t.dataset.tab || 'standby'; render(); toTop(); },
  goWeek: function (t) { state.week = weekStartOf(t.dataset.date); state.view = 'roster'; render(); toTop(); },
  week: function (t) { const i = WEEKS.indexOf(state.week) + Number(t.dataset.d); if (i >= 0 && i < WEEKS.length) { state.week = WEEKS[i]; render(); } },
  heat: function (t) { state.heat = { dow: Number(t.dataset.dow), h: Number(t.dataset.h) }; render(); },
  dday: function (t) { state.demandDay = Number(t.dataset.i); render(); },
  factor: function (t) { state.factors[t.dataset.k] = !state.factors[t.dataset.k]; render(); },
  step: function (t) {
    const k = t.dataset.k, d = Number(t.dataset.d), lim = k === 'cap' ? [10, 40] : [1, 4];
    state[k] = Math.max(lim[0], Math.min(lim[1], state[k] + d)); render();
  },
  ltab: function (t) { state.leaveTab = t.dataset.t; render(); },
  covertab: function (t) { state.coverTab = t.dataset.t; render(); },
  leave: function (t) { setLeave(t.dataset.id, t.dataset.to); render(); },
  simulate: function () {
    const p = state.pool.shift(); if (!p) return;
    const l = Object.assign({ id: 'L' + (state.nextId++), submitted: TODAY, status: 'pending', via: 'Staff app chat' }, p);
    state.leaves.push(l); state.leaveTab = 'pending';
    const cleared = [];
    WEEKS.forEach(function (ws) { if (overlaps(l, ws) && isBuilt(ws) && !isUp(ws)) { state.rosters[ws] = emptyRoster(); state.explain[ws] = null; cleared.push(dShort(ws)); } });
    toast(staffById(l.staffId).first + ' asked for leave ' + daysBetween(TODAY, l.from) + ' days ahead. Rosterbot registered ' + leaveRange(l).text + '.' + (cleared.length ? ' The draft roster for the week of ' + cleared.join(' and ') + ' was cleared until you decide.' : '')); render();
  },
  simulateLate: function () {
    const p = validLatePool()[0]; if (!p) return;
    state.latePool = state.latePool.filter(function (x) { return x !== p; });
    state.clockMin += 3;
    const l = addLate(p); if (!l) return;
    toast(staffById(l.staffId).first + ' cancelled ' + dLabel(l.date) + ', ' + hRange(l.shift[0], l.shift[1]) + ', within 48 hours. It is open in Standby.'); render();
  },
  simulateOpt: function () {
    const p = validOptPool()[0]; if (!p) return;
    state.optPool = state.optPool.filter(function (x) { return x !== p; });
    state.clockMin += 2;
    const l = addOptOut(p); if (!l) return;
    toast(staffById(l.staffId).first + ' opted out of ' + dLabel(l.date) + ', ' + hRange(l.shift[0], l.shift[1]) + '. Posted to the team chat.'); render();
  },
  registerOpen: function (t) { registerOpen(t.dataset.key); render(); },
  postGap: function (t) { postGap(t.dataset.key); render(); },
  escalate: function (t) { escalate(t.dataset.id); render(); },
  optimise: function () { doOptimise(); },
  publish: function () {
    const ws = state.week, c = ctx(), ev = evalWeek(ws, R(), c);
    if (pendingFor(ws) > 0) { toast('Decide the leave requests for this week first.', 'bad'); return; }
    if (ev.clashes > 0) { toast('Remove ' + ev.clashes + ' ' + plural(ev.clashes, 'shift', 'shifts') + ' on approved leave before uploading.', 'bad'); return; }
    R().status = 'approved'; toast('Roster for ' + weekLabel(ws) + ' uploaded. Staff can now see it and opt out of shifts. This is a demo, nothing was sent.'); render();
  },
  edit: function (t) {
    if (isPast(t.dataset.date)) { toast('That day has already passed.'); return; }
    openModal(t.dataset.date, t.dataset.staff);
  },
  closeModal: function (t, e) { if (t.id === 'scrim' && e.target !== t) return; closeModal(); },
  saveShift: function () {
    const m = state.modal, s = Number(document.getElementById('m-start').value), e = Number(document.getElementById('m-end').value);
    if (e <= s) { toast('Finish time must be after the start.', 'bad'); return; }
    const ws = state.week, r = R(); r.shifts[m.date] = r.shifts[m.date] || {}; r.shifts[m.date][m.id] = [s, e];
    touchRoster(ws); closeModal();
    const c = ctx(), st = c.byId[m.id], hrs = weekHours(ws, r, c, m.id);
    toast(hrs > st.max ? 'Saved. ' + st.first + ' is now over their ' + st.max + 'h weekly limit.' : 'Shift saved.', hrs > st.max ? 'bad' : ''); render();
  },
  removeShift: function () {
    const m = state.modal, ws = state.week, r = R(); delete r.shifts[m.date][m.id]; touchRoster(ws); closeModal(); toast('Shift removed.'); render();
  },
  alert: function (t) { sendAlert(t.dataset.key); render(); },
  alertAll: function (t) {
    const found = findGapByKey(t.dataset.gap); if (!found) return;
    standbyFor(found.gap, found.ws, found.r, ctx()).forEach(function (x) { if (x.free) sendAlert(t.dataset.gap + '|' + x.s.id); });
    render();
  },
  standbyDay: function (t) { const s = staffById(t.dataset.id), d = Number(t.dataset.d); s.standbyDays[d] = !s.standbyDays[d]; render(); }
};

document.addEventListener('click', function (e) {
  const t = e.target.closest('[data-act]');
  if (!t || !ACT[t.dataset.act]) return;
  ACT[t.dataset.act](t, e);
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && state.modal) closeModal(); });

/* ---------- start-up state ---------- */
WEEKS.forEach(function (w) { state.rosters[w] = emptyRoster(); });
(function () {
  const live = optimiseWeek(WEEKS[0], ctx());
  live.status = 'approved'; state.rosters[WEEKS[0]] = live;
  state.chat.push({ t: 'note', text: 'Roster for ' + weekLabel(WEEKS[0]) + ' was uploaded.', at: '' });
  INIT_LATE.forEach(function (p) { addLate(p, p.at); });
  INIT_OPT.forEach(function (p) { addOptOut(p, p.at); });
})();
render();

</script>
